<app-navbar-component />
<div class="container mt-5">
  <div class="row">
    <div class="col">
      @if (authenticated()) {
        <h1 class="text-center mb-5">Number Generator for {{ userName() }}</h1>
      } @else {
        <h1 class="text-center mb-5">Number Generator</h1>
      }

      <app-numberfield-component
        [numberstring]="overviewNumbers[index()]"
      ></app-numberfield-component>
      <p class="text-center mt-5">
        This application allows you to generate numbers and view them in a user-friendly interface.
      </p>
      <p class="text-center">This was made for a School Project, so be gentle</p>
    </div>
  </div>
</div>
